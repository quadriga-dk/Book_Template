name: Deploy book with Python, SPARQL, and R

# Deliberately no `workflow_dispatch` here: this workflow holds Pages/OIDC and
# artifact permissions and restores caches, so a manual dispatch could run it
# against an untrusted branch and poison those caches (CodeQL: "Cache Poisoning
# via caching of untrusted files"). To redeploy manually, dispatch the
# "Update Metadata" workflow instead - its completion triggers this one.
on:
  workflow_run:
    workflows: ["Update Metadata"]
    types:
      - completed
    branches:
      - main

# Serialise Pages deployments. Two deployments running at the same time fail
# with "Deployment request failed ... due to in progress deployment".
concurrency:
  group: github-pages
  cancel-in-progress: false

# This job installs dependencies, builds the book, and deploys it to GitHub Pages
# only runs if "Update Metadata" workflow is successful
permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to delete stale "github-pages" artifacts left behind by earlier
  # attempts of the same workflow run before uploading a new one.
  actions: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    # Safety cap for the whole job. The Pages deploy step is limited to
    # 10 minutes by the action itself; the build needs the room here.
    timeout-minutes: 90
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # Build the commit whose "Update Metadata" run just finished instead of
        # whatever the default branch points at when this job starts.
        ref: ${{ github.event.workflow_run.head_sha }}

    # Set up Python with pip caching
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: pip

    # Set up R with dependency caching
    - name: Set up R
      uses: r-lib/actions/setup-r@v2

    # Cache executed notebooks
    # only caches if set up in _config.yml with:
    # execute:
    #   execute_notebooks: cache
    - name: Cache executed notebooks
      uses: actions/cache@v6
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

    # Install Python dependencies
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    # Install R dependencies with caching
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: true
        cache-version: 2
        packages: |
          any::tidyverse
          any::IRkernel
        install-pandoc: false
        install-quarto: false

    # Register kernels with Jupyter.
    # IRkernel::installspec() shells out to `jupyter` from R and aborts with
    # "jupyter-client has to be installed" on newer Ubuntu runner images
    # (ubuntu-26.04) because that subprocess loses the toolcache Python's
    # site-packages. Install IRkernel's kernelspec from the Python side instead.
    - name: Set up IRkernel
      run: |
        kernel_dir="$(Rscript -e 'cat(system.file("kernelspec", package = "IRkernel"))')"
        jupyter kernelspec install --user --replace --name ir "$kernel_dir"

    - name: Install SPARQL kernel
      run: |
        jupyter sparqlkernel install --user

    # Check all kernels
    - name: Log all available kernels
      run: |
        jupyter kernelspec list

    - name: Build the book
      run: |
        jupyter-book build .

    - name: Inject all metadata into HTML
      run: |
        python -m quadriga.metadata.inject_all_metadata
        echo "Injected all metadata (OpenGraph, JSON-LD, and RDF links) into HTML head"

    - name: Copy metadata files to build directory
      run: |
        cp quadriga-metadata.jsonld _build/html/quadriga-metadata.jsonld
        cp quadriga-metadata.rdf _build/html/quadriga-metadata.rdf
        echo "Copied metadata files to _build/html for discovery"

    # A re-run of this workflow appends another artifact named "github-pages"
    # to the same run instead of replacing the previous one. deploy-pages then
    # aborts with "Multiple artifacts named github-pages were unexpectedly
    # found". Drop leftovers first so a re-run is as good as a fresh run.
    - name: Delete stale Pages artifacts from earlier attempts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
          --jq '.artifacts[] | select(.name == "github-pages") | .id' |
        while read -r artifact_id; do
          echo "Deleting stale artifact ${artifact_id}"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
        done

    - name: Upload book artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: "_build/html"

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      # No `timeout` override: 600000 ms (10 minutes) is the maximum the action
      # accepts, so a slow Pages sync cannot be fixed by waiting longer - keep
      # the published site small instead.
